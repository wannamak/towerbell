<html lang="en">
<head>
  <title>Tower Bell</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/common.css">
  <link rel="stylesheet" href="/static/ring.css">
  <script src="/static/xhr.js"></script>
  <script src="/static/ring.js"></script>
  <script src="/static/time.js"></script>
</head>
<body>

$HEADER

<div style="padding-top: 1em; padding-bottom: 1em;"></div>

<div style="display: flex; justify-content: center; flex-direction: column; align-items: center; gap: 3em;">
  <div class="infobox">
    <span style="color: #555555;">Current time:</span> <span id="clock"></span><br/>
    <span style="color: #555555;">Next event:</span> <span id="countdown"></span>
  </div>

  <div>
    <div class="ringbutton" onclick="onRing();">R I N G</div>
  </div>

  <form id="ringForm">

  <div class="table">
    <div class="row header">
      <div class="cell"><label for="pitchname">Pitch</label></div>
    </div>

    <div class="row">
      <div class="cell">
        <select
            id="pitchname" name="pitchname" class="inputbox">
          $PITCH_NAMES
        </select>
      </div>
    </div>
  </div>

  <div class="table">
    <div class="row header">
      <div class="cell"><label for="strikedurationmillis">Strike Duration ms</label></div>
    </div>

    <div class="row">
      <div class="cell">
        <input id="strikedurationmillis" name="strikedurationmillis"
               type="number" min="0" max="60000" value="3000"
               class="inputbox" style="width: 8ch;">
        milliseconds
      </div>
    </div>
  </div>

  <div class="table">
    <div class="row header">
      <div class="cell"><label for="pausedurationmillis">Pause Duration ms</label></div>
    </div>

    <div class="row">
      <div class="cell">
        <input id="pausedurationmillis" name="pausedurationmillis"
               type="number" min="0" max="60000" value="3000"
               class="inputbox" style="width: 8ch;">
        milliseconds
      </div>
    </div>
  </div>

  <div class="table">
    <div class="row header">
      <div class="cell"><label for="retractdurationmillis">Retract Duration ms</label></div>
    </div>

    <div class="row">
      <div class="cell">
        <input id="retractdurationmillis" name="retractdurationmillis"
               type="number" min="0" max="60000" value="3000"
               class="inputbox" style="width: 8ch;">
        milliseconds
      </div>
    </div>
  </div>

  </form>

  <div>
    <div class="errormessage" id="errorMessage"></div>
  </div>

  <div>
    <a href="/">Back</a>
  </div>
</div>

<script lang="javascript">
const serverNow = new Date("$ISO_NOW");
const isoNextRingString = "$ISO_NEXT_RING_MAYBE_EMPTY";
const nextRingOverrideString = "$NEXT_RING_OVERRIDE_STRING_MAYBE_EMPTY";
const numRingsString = "$NEXT_RING_NUM_RINGS";
</script>
<script src="/static/infobox.js"></script>

</body>
</html>
